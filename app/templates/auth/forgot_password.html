{% extends "auth/auth_base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<h2 class="h3 mb-1">Forgot password</h2>
<p class="text-muted mb-4">Enter your registered email and we'll create a password reset link.</p>
<form method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label" for="email">Email</label>
    <input class="form-control" type="email" id="email" name="email" required autofocus>
  </div>
  <button class="btn btn-primary w-100 py-2" type="submit">Generate reset link</button>
</form>
<p class="text-center small mt-4"><a href="{{ url_for('auth.login') }}" class="text-decoration-none">← Back to log in</a></p>
{% endblock %}
